; ASTRAWILD DefaultScalability.ini
; Inheriting engine base scalability defaults for maximum stability across all quality levels.
; Sections below are the engine minimum required for vertical-slice visual polish contracts
; (see Scripts/validate_content_contracts.py — visual polish settings).

[GlobalIlluminationQuality@3]
r.GlobalIllumination.MinLuminance=0.001
r.Lumen.HardwareRayTracing=1
r.Lumen.ScreenProbeGather.TemporalFilterProbes=1
r.Lumen.SurfaceCache.ProbeSpacing=200.0
r.Lumen.UpdateFrequency=8.0

[ReflectionQuality@3]
r.Lumen.Reflections.HardwareRayTracing=1
r.Lumen.Reflections.MaxBounces=8
r.Lumen.Reflections.SmoothBias=0.75
r.Lumen.Reflections.MaxRayIntensity=8.0
r.SkyLight.RealTimeReflectionCapture=1

[VolumetricFogQuality@3]
r.VolumetricFog=1
r.VolumetricFog.DepthDistributionScale=64.0
r.VolumetricFog.GridSize=64
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.Jitter=0.5
r.VolumetricFog.LightFunction=1
r.VolumetricFog.TemporalReprojection=1
r.VolumetricFog.ConservativeDepth=1

[FoliageQuality@3]
r.Foliage.DitheredLOD=0
r.Foliage.LODDistanceScale=1.0
r.Foliage.MinLOD=0
r.AllowLandscapeShadows=1
r.Nanite.ProjectEnabled=1
r.Nanite.AllowFoliage=1
